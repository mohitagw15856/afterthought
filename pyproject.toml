[project]
name = "afterthought"
version = "0.1.0"
description = "What happens after the answer: compile, decide, verify, share, replay and coach your AI work into a trustworthy wiki."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mohit" }]
keywords = ["llm", "wiki", "obsidian", "knowledge-base", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.50"]
openai = ["httpx>=0.27"]
all = ["anthropic>=0.50", "httpx>=0.27"]

[project.scripts]
afterthought = "afterthought.cli:app"

[project.urls]
Homepage = "https://github.com/mohitagw15856/afterthought"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afterthought"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "anthropic>=0.50", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Anthropic API (needs --live and ANTHROPIC_API_KEY)"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"src/afterthought/compile/extract.py" = ["E501"]
"src/afterthought/verify/extract.py" = ["E501"]
"src/afterthought/decide/cli.py" = ["E501"]
